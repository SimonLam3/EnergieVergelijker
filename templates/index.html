<!DOCTYPE html>
<html lang="nl">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Energievergelijker</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="bg-light">

<div class="container mt-4">

    <h1 class="mb-4">
        Energievergelijker
    </h1>

    <form method="post" class="card p-4 mb-4">

        <div class="row">

            <div class="col-md-3 mb-3">
                <label class="form-label">Postcode</label>

                <input
                    type="text"
                    class="form-control"
                    name="postcode"
                    required
                >
            </div>

            <div class="col-md-3 mb-3">
                <label class="form-label">Huisnummer</label>

                <input
                    type="number"
                    class="form-control"
                    name="huisnummer"
                    required
                >
            </div>

            <div class="col-md-3 mb-3">
                <label class="form-label">Toevoeging</label>

                <input
                    type="text"
                    class="form-control"
                    name="toevoeging"
                >
            </div>

        </div>

        <div class="row">

            <div class="col-md-3 mb-3">
                <label class="form-label">
                    Normaal verbruik
                </label>

                <input
                    type="number"
                    class="form-control"
                    name="stroom_verbruik"
                    required
                >
            </div>

            <div class="col-md-3 mb-3">
                <label class="form-label">
                    Dal verbruik
                </label>

                <input
                    type="number"
                    class="form-control"
                    name="stroom_verbruik_dal"
                    required
                >
            </div>

            <div class="col-md-3 mb-3">
                <label class="form-label">
                    TL Normaal
                </label>

                <input
                    type="number"
                    class="form-control"
                    name="teruglevering"
                    value="0"
                    required
                >
            </div>

            <div class="col-md-3 mb-3">
                <label class="form-label">
                    TL Dal
                </label>

                <input
                    type="number"
                    class="form-control"
                    name="teruglevering_dal"
                    value="0"
                    required
                >
            </div>

        </div>

        <div class="row">

            <div class="col-md-3 mb-3">
                <label class="form-label">
                    Gasverbruik
                </label>

                <input
                    type="number"
                    class="form-control"
                    name="gas"
                    required
                >
            </div>

            <div class="col-md-3 mb-3 d-flex align-items-end">

                <div class="form-check">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        name="slimme_meter"
                        id="slimme_meter"
                    >

                    <label
                        class="form-check-label"
                        for="slimme_meter"
                    >
                        Slimme meter
                    </label>

                </div>

            </div>

        </div>

        <button
            type="submit"
            class="btn btn-primary"
        >
            Vergelijk
        </button>

    </form>

    {% if resultaten %}

    <div class="card p-4 mb-4">

        <div class="btn-group mb-4 d-flex justify-content-center">

            <button
                type="button"
                class="btn btn-outline-primary"
                onclick="toonGrafiek('1_jaar')"
            >
                1 jaar vast
            </button>

            <button
                type="button"
                class="btn btn-outline-primary"
                onclick="toonGrafiek('3_jaar')"
            >
                3 jaar vast
            </button>

            <button
                type="button"
                class="btn btn-outline-primary"
                onclick="toonGrafiek('variabel')"
            >
                Variabel
            </button>

            <button
                type="button"
                class="btn btn-outline-primary"
                onclick="toonGrafiek('dynamisch')"
            >
                Dynamisch
            </button>

        </div>

        <div style="height:500px">
            <canvas id="prijsGrafiek"></canvas>
        </div>

    </div>

    <script>

        const offertes =
            {{ resultaten|tojson|safe }};

        let chart = null;

        console.log(offertes);
        console.log(typeof offertes);

        function toonGrafiek(type)
        {
            const gefilterd =
                (offertes[type] || [])
                    .sort(
                        (a, b) =>
                            a.jaarprijs - b.jaarprijs
                    );

            const labels =
                gefilterd.map(
                    offerte =>
                        offerte.leverancier
                );

            const prijzen =
                gefilterd.map(
                    offerte =>
                        offerte.jaarprijs
                );

            if(chart)
            {
                chart.destroy();
            }

            const ctx =
                document
                .getElementById("prijsGrafiek")
                .getContext("2d");

            chart =
                new Chart(ctx, {

                type: "bar",

                data: {

                    labels: labels,

                    datasets: [{

                        label: "Jaarprijs (€)",

                        data: prijzen,

                        backgroundColor: [
                            "#198754",
                            "#0d6efd",
                            "#ffc107",
                            "#dc3545",
                            "#6f42c1",
                            "#20c997",
                            "#fd7e14",
                            "#6c757d"
                        ]

                    }]
                },

                    options: {

                        responsive: true,

                        plugins: {

                            legend: {
                                display: false
                            },

                            tooltip: {

                                callbacks: {

                                    title: function(context) {

                                        const index =
                                            context[0].dataIndex;

                                        return gefilterd[index].contract;
                                    },

                                    label: function(context) {

                                        return (
                                            "€" +
                                            context.raw.toFixed(2)
                                        );
                                    }
                                }
                            },

                            title: {
                                display: true,
                                text: "Vergelijking energiecontracten"
                            }
                        }
                    }

            });
        }

        toonGrafiek("1_jaar");

    </script>

    {% endif %}

</div>

</body>
</html>
